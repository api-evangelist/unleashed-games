description: Unleashed Games is an independent game studio founded by industry veterans
  (World of Warcraft, Medal of Honor, Monopoly Go!) and backed by a16z Speedrun, building
  socially-driven cooperative games. Its flagship title Haven is a cross-platform co-op
  RPG for families and friends spanning PC, Mac, console, and mobile, with procedurally
  generated maps, village building, and collaborative combat. The studio publishes no
  public developer platform or API surface today.
